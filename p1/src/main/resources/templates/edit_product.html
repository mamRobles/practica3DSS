<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">

        <!-- Navbar -->
        <nav class="navbar navbar-light bg-light mb-4">
            <a class="navbar-brand" th:href="@{/}">
                <img src="https://img.icons8.com/ios-filled/50/000000/home.png"
                     alt="Inicio" width="30" height="30">
            </a>
            <a th:href="@{/admin}" class="btn btn-secondary">Volver a administración</a>
        </nav>

        <h1 class="text-center my-5">Editar producto</h1>

        <div class="row">
            <div class="col-md-6 mx-auto">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Datos del producto</h5>
                    </div>

                    <div class="card-body">
                        <!-- Thymeleaf añade el token CSRF automáticamente con th:action -->
                        <form th:action="@{/products/edit/{id}(id=${product.id})}" method="post">

                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre del producto</label>
                                <input type="text"
                                       id="name"
                                       name="name"
                                       class="form-control"
                                       th:value="${product.name}"
                                       maxlength="100"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label for="price" class="form-label">Precio</label>
                                <input type="number"
                                       id="price"
                                       name="price"
                                       class="form-control"
                                       step="0.01"
                                       min="0"
                                       th:value="${product.price}"
                                       required>
                            </div>

                            <div class="d-flex justify-content-between">
                                <a th:href="@{/admin}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
